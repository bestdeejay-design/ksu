<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="Ksenia — Graphic Designer Portfolio">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0ABAB5"/>
      <stop offset="16%" stop-color="#00B3DA"/>
      <stop offset="33%" stop-color="#44A3F7"/>
      <stop offset="50%" stop-color="#838EFF"/>
      <stop offset="66%" stop-color="#B477F2"/>
      <stop offset="83%" stop-color="#DB5FC9"/>
      <stop offset="100%" stop-color="#F64A8A"/>
    </linearGradient>
    <mask id="wave">
      <rect width="1280" height="640" fill="#FFFFFF"/>
      <path fill="#000000" d="M0,640 L0,560 Q180,525 430,560 T860,560 T1280,560 L1280,640 Z">
        <animate attributeName="d" dur="6s" repeatCount="indefinite" begin="-3.6s"
          keyTimes="0;0.333;0.667;1" calcMode="spline" keySplines="0.5 0 0.5 1;0.5 0 0.5 1;0.5 0 0.5 1"
          values="M0,640 L0,560 Q180,525 430,560 T860,560 T1280,560 L1280,640 Z;M0,640 L0,568 Q180,540 430,568 T860,568 T1280,568 L1280,640 Z;M0,640 L0,552 Q180,510 430,552 T860,552 T1280,552 L1280,640 Z;M0,640 L0,560 Q180,525 430,560 T860,560 T1280,560 L1280,640 Z"/>
      </path>
    </mask>
    <linearGradient id="flash" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1280" y2="0">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="35%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="44%" stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="48%" stop-color="#FFFFFF" stop-opacity="0.20"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.25"/>
      <stop offset="52%" stop-color="#FFFFFF" stop-opacity="0.20"/>
      <stop offset="56%" stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="65%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <g mask="url(#wave)">
    <rect width="1280" height="640" fill="url(#bg)"/>

    <rect width="1280" height="640" fill="url(#flash)">
      <animateTransform attributeName="transform" type="translate" values="-640,0;-640,0;640,0;640,0" keyTimes="0;0.05;0.28;1" dur="16s" calcMode="linear" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0;1;1;1;0;0" keyTimes="0;0.03;0.05;0.28;0.35;1" dur="16s" repeatCount="indefinite"/>
    </rect>

    <path fill="#FFFFFF" opacity="0.25" d="M0,640 L0,525 Q220,490 540,525 T1080,525 T1280,525 L1280,640 Z">
      <animate attributeName="d" dur="6s" repeatCount="indefinite" begin="-1.8s"
        keyTimes="0;0.333;0.667;1" calcMode="spline" keySplines="0.5 0 0.5 1;0.5 0 0.5 1;0.5 0 0.5 1"
        values="M0,640 L0,525 Q220,490 540,525 T1080,525 T1280,525 L1280,640 Z;M0,640 L0,535 Q220,505 540,535 T1080,535 T1280,535 L1280,640 Z;M0,640 L0,515 Q220,475 540,515 T1080,515 T1280,515 L1280,640 Z;M0,640 L0,525 Q220,490 540,525 T1080,525 T1280,525 L1280,640 Z"/>
    </path>
    <path fill="#FFFFFF" opacity="0.5" d="M0,640 L0,490 Q170,452 340,490 T680,490 T1020,490 T1280,490 L1280,640 Z">
      <animate attributeName="d" dur="6s" repeatCount="indefinite" begin="0s"
        keyTimes="0;0.333;0.667;1" calcMode="spline" keySplines="0.5 0 0.5 1;0.5 0 0.5 1;0.5 0 0.5 1"
        values="M0,640 L0,490 Q170,452 340,490 T680,490 T1020,490 T1280,490 L1280,640 Z;M0,640 L0,502 Q170,470 340,502 T680,502 T1020,502 T1280,502 L1280,640 Z;M0,640 L0,478 Q170,434 340,478 T680,478 T1020,478 T1280,478 L1280,640 Z;M0,640 L0,490 Q170,452 340,490 T680,490 T1020,490 T1280,490 L1280,640 Z"/>
    </path>

    <g>
      <animate attributeName="opacity" values="0;1" dur="1.5s" fill="freeze"/>
      <text x="642" y="262" font-family="'Arial Black','Helvetica Neue',Arial,sans-serif" font-size="110" font-weight="bold" fill="#000000" opacity="0.28" text-anchor="middle">Ksenia</text>
      <text x="640" y="260" font-family="'Arial Black','Helvetica Neue',Arial,sans-serif" font-size="110" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Ksenia</text>
    </g>

    <g>
      <animate attributeName="opacity" values="0;1" dur="1.5s" begin="0.5s" fill="freeze"/>
      <text x="642" y="352" font-family="'Helvetica Neue',Arial,sans-serif" font-size="42" fill="#000000" opacity="0.30" text-anchor="middle">Graphic Designer Portfolio</text>
      <text x="640" y="350" font-family="'Helvetica Neue',Arial,sans-serif" font-size="42" fill="#FFFFFF" opacity="0.95" text-anchor="middle">Graphic Designer Portfolio</text>
    </g>

    <g>
