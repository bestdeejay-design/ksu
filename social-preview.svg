      <text x="642" y="430" font-family="'Helvetica Neue',Arial,sans-serif" font-size="30" fill="#000000" opacity="0.25" text-anchor="middle">bestdeejay-design.github.io/ksu</text>
      <text x="640" y="428" font-family="'Helvetica Neue',Arial,sans-serif" font-size="30" fill="#FFFFFF" opacity="0.85" text-anchor="middle">bestdeejay-design.github.io/ksu</text>
